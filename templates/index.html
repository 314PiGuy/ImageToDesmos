<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image to Desmos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <aside class="controls">
      <header>
        <div class="mark">∿</div>
        <div><h1>Image to Desmos</h1><p>Turn an image into clean graph curves.</p></div>
      </header>

      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/*">
        <span class="drop-title">Drop an image here</span>
        <span class="drop-note">or click to choose one</span>
      </label>

      <section>
        <h2>Image</h2>
        <div class="modes">
          <label><input type="radio" name="mode" value="threshold" checked><span>Ink</span></label>
          <label><input type="radio" name="mode" value="canny"><span>Edges</span></label>
        </div>
        <label class="check stage"><input name="resize_enabled" data-controls="size" type="checkbox" checked> Resize large images</label>
        <label class="slider">Max size <output></output><input name="size" type="range" min="1" max="4000" value="900"></label>
        <label class="check stage"><input name="blur_enabled" data-controls="blur" type="checkbox" checked> Gaussian blur</label>
        <label class="slider">Blur <output></output><input name="blur" type="range" min="1" max="51" value="3" step="2"></label>
        <label class="slider ink">Threshold <output></output><input name="threshold" type="range" min="0" max="255" value="145"></label>
        <label class="slider edges">Canny low <output></output><input name="canny_low" type="range" min="0" max="255" value="35"></label>
        <label class="slider edges">Canny high <output></output><input name="canny_high" type="range" min="0" max="255" value="130"></label>
        <label class="check stage edges"><input name="join_enabled" data-controls="join" type="checkbox" checked> Join Canny edges</label>
        <label class="slider edges">Join edges <output></output><input name="join" type="range" min="0" max="32" value="1"></label>
        <label class="check stage"><input name="close_enabled" data-controls="close" type="checkbox" checked> Close gaps</label>
        <label class="slider">Close radius <output></output><input name="close" type="range" min="0" max="32" value="1"></label>
      </section>

      <section>
        <h2>Skeleton</h2>
        <label class="check stage"><input name="skeleton_enabled" data-controls="skeleton_kernel" type="checkbox" checked> Skeletonize</label>
        <label class="slider">Kernel <output></output><input name="skeleton_kernel" type="range" min="3" max="15" value="3" step="2"></label>
        <label class="check stage"><input name="prune_enabled" data-controls="prune" type="checkbox" checked> Remove flecks</label>
        <label class="slider">Minimum pixels <output></output><input name="prune" type="range" min="0" max="2000" value="4"></label>
      </section>

      <section>
        <h2>Potrace</h2>
        <label class="check stage"><input name="trace_enabled" data-section="potrace" type="checkbox" checked> Run Potrace</label>
        <div data-stage-options="potrace">
        <label class="slider">Speckle size <output></output><input name="turdsize" type="range" min="0" max="2000" value="2"></label>
        <label class="slider">Corner threshold <output></output><input name="alphamax" type="range" min="0" max="2" value="1" step="0.01"></label>
        <label class="slider">Curve tolerance <output></output><input name="opttolerance" type="range" min="0" max="10" value="0.2" step="0.05"></label>
        <label class="select">Turn policy
          <select name="turnpolicy">
            <option value="minority">Minority</option><option value="majority">Majority</option>
            <option value="black">Black</option><option value="white">White</option>
            <option value="left">Left</option><option value="right">Right</option><option value="random">Random</option>
          </select>
        </label>
        <label class="check"><input name="opticurve" type="checkbox" checked> Optimize curves</label>
        </div>
      </section>
    </aside>

    <section class="workspace">
      <nav class="tabs">
        <button data-stage="original">Original</button><button data-stage="processed">Processed</button>
        <button data-stage="skeleton">Skeleton</button><button class="active" data-stage="traced">Potrace</button>
      </nav>
      <div class="preview empty" id="preview">
        <div class="empty-state"><div class="empty-icon">⌁</div><h2>Your preview appears here</h2><p>Choose a drawing or photo, then tune each stage before opening the graph.</p></div>
        <img id="preview-image" alt="Conversion preview">
        <div class="busy"><span></span><p>Tracing preview…</p></div>
      </div>
      <footer>
        <div><strong id="status">Waiting for an image</strong><span id="details">PNG, JPG, or WEBP · up to 12 MB</span></div>
        <button id="launch" disabled>Open in Desmos <span>→</span></button>
      </footer>
    </section>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
